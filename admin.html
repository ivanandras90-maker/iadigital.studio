function bindHeroBackground(){
 const f=document.getElementById('heroBgFile'); if(!f) return;
 f.addEventListener('change',()=>{
  const file=f.files&&f.files[0]; if(!file) return;
  if(!/^image\/(jpeg|webp|png)$/.test(file.type)){showToast('JPG, WebP vagy PNG fájl szükséges.');f.value='';return;}
  if(file.size>8*1024*1024){showToast('A kép legfeljebb 8 MB lehet.');f.value='';return;}
  const reader=new FileReader();
  reader.onload=()=>{d.settings.heroBackground=reader.result;localStorage.setItem(KEY,JSON.stringify(d));render('appearance');showToast('Hero háttérkép feltöltve.');};
  reader.readAsDataURL(file);
 });
}
function clearHeroBackground(){d.settings.heroBackground='';localStorage.setItem(KEY,JSON.stringify(d));render('appearance');showToast('A hero háttérképe törölve.');}
function changeLang(x){lang=x;render(current)}
function collect(){
 document.querySelectorAll('[data-key]').forEach(el=>{
  const k=el.dataset.key, v=el.type==='checkbox'?el.checked:el.value;
  if(k.startsWith('project_')){const parts=k.split('_');if(parts[1]==='enabled'){d.projects[Number(parts[2])].enabled=v}else if(parts[1]==='url'){d.projects[Number(parts[2])].url=v}else if(parts[1]==='type'){d.projects[Number(parts[2])].type=v}else if(parts[1]==='i18n'){const field=parts[2],i=Number(parts[3]);const key=field==='title'?'title':field==='category'?'category':'description';d.projects[i].i18n[lang][key]=v}}
  else if(['siteTitle','accent','dark','soft'].includes(k))d.settings[k]=v;
  else if(['phone','email','location','facebook','profilePhoto'].includes(k))d.contact[k]=v;
  else if(k==='aboutVideoUrl')d.aboutVideoUrl=v;
  else if(fields.includes(k))d.languages[lang][k]=v;
 });
 localStorage.setItem(KEY,JSON.stringify(d));showToast('A módosítások mentve.');
}
function save(){collect()}
function addProject(){const id='project'+Date.now();d.projects.push({id,title:'Új projekt',category:'WEB',description:'Projekt leírása',url:'',type:'WEB',enabled:true,i18n:{cs:{title:'Nový projekt',category:'WEB',description:'Popis projektu'},en:{title:'New project',category:'WEB',description:'Project description'},uk:{title:'Новий проєкт',category:'WEB',description:'Опис проєкту'},hu:{title:'Új projekt',category:'WEB',description:'Projekt leírása'}}});localStorage.setItem(KEY,JSON.stringify(d));render('projects')}

const ANALYTICS_CONFIG_KEY='ia-goatcounter-config-v1';
function analyticsConfig(){try{return JSON.parse(localStorage.getItem(ANALYTICS_CONFIG_KEY)||'{}')}catch(e){return {}}}
function renderAnalyticsPanel(){
 const c=analyticsConfig();
 panel.innerHTML=`<div class="analytics-head"><div><p class="eyebrow">WEBSITE ANALYTICS</p><h2>Látogatottsági statisztika</h2><p class="hint">Privát adminnézet: látogatások száma, napi grafikon és legnézettebb oldalak. Az adatok a GoatCounter szolgáltatásból érkeznek, nem becslések.</p></div><a class="btn" href="https://www.goatcounter.com/" target="_blank" rel="noopener">GoatCounter ↗</a></div>
 <style>.analytics-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0}.analytics-kpi{border:1px solid #dce8df;background:linear-gradient(135deg,#fff,#f4faf6);border-radius:15px;padding:20px}.analytics-kpi span{font-size:12px;color:#64736a}.analytics-kpi strong{display:block;font-size:30px;line-height:1.3;margin-top:8px;color:#163c27}.analytics-panel{background:#fff;border:1px solid #dce8df;border-radius:15px;padding:20px;margin:14px 0;min-width:0}.analytics-chart{width:100%;height:auto;display:block;overflow:visible}.analytics-table{width:100%;border-collapse:collapse}.analytics-table th,.analytics-table td{text-align:left;border-bottom:1px solid #e8eee9;padding:11px 8px;font-size:13px}.analytics-table th{color:#66766c}.analytics-config-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.analytics-config-grid label{display:block;font-size:13px;color:#435348}.analytics-config-grid input{display:block;width:100%;margin-top:6px;padding:11px;border:1px solid #d6e1d9;border-radius:8px;box-sizing:border-box}.analytics-status{padding:11px 13px;border-radius:9px;background:#f4f7f5;color:#46574b;font-size:13px;margin-top:12px}.analytics-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.analytics-toolbar select{padding:9px;border:1px solid #d6e1d9;border-radius:8px}.analytics-empty{padding:24px;border:1px dashed #cad8ce;border-radius:10px;color:#64736a}@media(max-width:700px){.analytics-grid{grid-template-columns:1fr}.analytics-config-grid{grid-template-columns:1fr}.analytics-kpi strong{font-size:25px}}</style>
 <div class="analytics-panel"><h3>Kapcsolat beállítása</h3><p class="hint">1) Hozz létre egy GoatCounter oldalt. 2) Az API menüben készíts kulcsot olvasási/statisztikai jogosultsággal. Az API-kulcs csak a böngésző munkamenetében tárolódik; ne használj nyilvános vagy megosztott gépet.</p><div class="analytics-config-grid"><label>GoatCounter webhely-kód<input id="analyticsCode" placeholder="pl. ivanandras" value="${esc(c.code||'')}"></label><label>GoatCounter API-kulcs<input id="analyticsToken" type="password" autocomplete="off" placeholder="API token (nem mentjük tartósan)"></label></div><div class="analytics-toolbar" style="margin-top:14px"><button class="btn green" onclick="saveAnalyticsSettings()">Beállítás / kapcsolódás</button><button class="btn" onclick="loadAnalyticsStats()">Frissítés</button><label>Időszak <select id="analyticsRange" onchange="loadAnalyticsStats()"><option value="7">Utolsó 7 nap</option><option value="30" selected>Utolsó 30 nap</option><option value="90">Utolsó 90 nap</option></select></label></div><div id="analyticsStatus" class="analytics-status" aria-live="polite">Add meg a webhely-kódot és az API-kulcsot a statisztikák betöltéséhez.</div></div>
 <div class="analytics-grid"><div class="analytics-kpi"><span>Összes látogatás az időszakban</span><strong id="analyticsTotal">—</strong></div><div class="analytics-kpi"><span>Legforgalmasabb nap</span><strong id="analyticsPeak">—</strong></div><div class="analytics-kpi"><span>Nyomon követett oldalak</span><strong id="analyticsPages">—</strong></div></div>
 <div class="analytics-panel"><div class="analytics-toolbar" style="justify-content:space-between"><h3>Napi látogatások</h3><span class="hint">A grafikon valódi GoatCounter-adatokat mutat.</span></div><div id="analyticsChart" class="analytics-empty">A grafikon betöltés után jelenik meg.</div></div>
 <div class="analytics-panel"><h3>Legnézettebb oldalak</h3><div id="analyticsTopPages" class="analytics-empty">Nincs még betöltött adat.</div></div>
 <div class="analytics-panel"><h3>Fontos a működéshez</h3><p class="hint">A méréshez a nyilvános oldalakban is be kell tölteni a GoatCounter követőkódját. Ebben a projektben az <code>analytics-tracking.js</code> fájl végzi ezt; a fájlban a <code>GOATCOUNTER_CODE</code> értékét ugyanarra a webhelykódra kell állítani, amelyet fent megadtál. A számláló nem kerül a nyilvános oldal láblécébe. A böngészőből indított API-kérés csak akkor működik, ha a szolgáltatás engedi a CORS-kéréseket.</p></div>`;
 const tok=sessionStorage.getItem('ia-goatcounter-token');if(tok)document.getElementById('analyticsToken').placeholder='API-kulcs mentve erre a munkamenetre';

function saveAnalyticsSettings(){const code=document.getElementById('analyticsCode').value.trim().replace(/[^a-zA-Z0-9-]/g,'');if(!code){showToast('Add meg a GoatCounter webhelykódját.');return}localStorage.setItem(ANALYTICS_CONFIG_KEY,JSON.stringify({code}));const t=document.getElementById('analyticsToken').value.trim();if(t)sessionStorage.setItem('ia-goatcounter-token',t);showToast('Beállítás mentve a böngészőbe.');loadAnalyticsStats()}
function analyticsDate(days, end=false){const d=new Date();d.setUTCMinutes(0,0,0);if(end)d.setUTCHours(d.getUTCHours()+1);else d.setUTCDate(d.getUTCDate()-days+1);return d.toISOString()}
function fmtNum(n){return Number(n||0).toLocaleString('hu-HU')}
async function loadAnalyticsStats(){
 const c=analyticsConfig(),token=(document.getElementById('analyticsToken')?.value||'').trim()||sessionStorage.getItem('ia-goatcounter-token');const status=document.getElementById('analyticsStatus');if(!status)return;
 if(!c.code||!token){status.textContent='Add meg a webhelykódot és az API-kulcsot. A statisztikák csak a szolgáltatás beállítása után jelennek meg.';return}
 if(document.getElementById('analyticsToken')?.value.trim())sessionStorage.setItem('ia-goatcounter-token',token);
 const days=Number(document.getElementById('analyticsRange')?.value||30);const base=`https://${c.code}.goatcounter.com/api/v0`;const headers={'Authorization':'Bearer '+token,'Accept':'application/json'};
 status.textContent='Statisztikák betöltése…';
 try{
  const start=encodeURIComponent(analyticsDate(days)),end=encodeURIComponent(analyticsDate(0,true));
  const [me,total,hits]=await Promise.all([
   fetch(base+'/me',{headers}).then(async r=>{if(!r.ok)throw new Error('API-hitelesítés sikertelen ('+r.status+'). Ellenőrizd a kulcs jogosultságát.');return r.json()}),
   fetch(base+'/stats/total?start='+start+'&end='+end,{headers}).then(async r=>{if(!r.ok)throw new Error('Összesítő statisztika nem érhető el ('+r.status+').');return r.json()}),
   fetch(base+'/stats/hits?start='+start+'&end='+end+'&daily=true',{headers}).then(async r=>{if(!r.ok)throw new Error('Oldalstatisztika nem érhető el ('+r.status+').');return r.json()})
  ]);
  const totalNum=Number(total.total??total.total_utc??0);document.getElementById('analyticsTotal').textContent=fmtNum(totalNum);
  const daily={};(total.stats||[]).forEach(x=>{if(x.day)daily[x.day]=Number(x.daily||0)});
  const rows=Object.entries(daily).sort((a,b)=>a[0].localeCompare(b[0]));const peak=rows.reduce((a,b)=>b[1]>a[1]?b:a,['—',0]);document.getElementById('analyticsPeak').textContent=peak[0]==='—'?'—':fmtNum(peak[1])+' · '+peak[0];
  const pages=hits.hits||[];document.getElementById('analyticsPages').textContent=fmtNum(pages.length);
  drawAnalyticsChart(rows);drawAnalyticsPages(pages);status.textContent='Sikeres kapcsolat: '+(me.email||me.username||c.code)+'. Frissítve: '+new Date().toLocaleString('hu-HU')+'.';
 }catch(e){status.textContent='Nem sikerült betölteni: '+e.message+' Ha CORS-hiba jelenik meg, használd a GoatCounter saját statisztikai felületét vagy egy szerveroldali közvetítést; az API-kulcsot ne tedd nyilvános fájlba.';document.getElementById('analyticsChart').innerHTML='<div class="analytics-empty">Nem érkezett grafikonadat.</div>';}
}
function drawAnalyticsChart(rows){const el=document.getElementById('analyticsChart');if(!el)return;if(!rows.length){el.innerHTML='<div class="analytics-empty">Nincs adat a kiválasztott időszakra.</div>';return}const W=900,H=270,pad=38,vals=rows.map(r=>r[1]),max=Math.max(1,...vals),step=(W-pad*2)/Math.max(1,rows.length-1);const points=rows.map((r,i)=>`${pad+i*step},${H-pad-(r[1]/max)*(H-pad*2)}`).join(' ');const bars=rows.map((r,i)=>{const bw=Math.max(2,Math.min(16,(W-pad*2)/rows.length*.65)),x=pad+i*step-bw/2,y=H-pad-(r[1]/max)*(H-pad*2);return `<rect x="${x}" y="${y}" width="${bw}" height="${H-pad-y}" rx="2" fill="#2f8f5b"><title>${r[0]}: ${r[1]} látogatás</title></rect>`}).join('');const labels=rows.filter((r,i)=>i===0||i===rows.length-1||i%Math.ceil(rows.length/6)===0).map(r=>{const i=rows.indexOf(r);return `<text x="${pad+i*step}" y="${H-10}" font-size="11" text-anchor="middle" fill="#65756b">${r[0].slice(5)}</text>`}).join('');el.className='';el.innerHTML=`<svg class="analytics-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Napi látogatások oszlopdiagramja"><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#dbe6de"/>${[0,.25,.5,.75,1].map(f=>`<line x1="${pad}" y1="${H-pad-f*(H-pad*2)}" x2="${W-pad}" y2="${H-pad-f*(H-pad*2)}" stroke="#edf2ee"/>`).join('')}${bars}<polyline points="${points}" fill="none" stroke="#145c35" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${labels}</svg>`}
function drawAnalyticsPages(pages){const el=document.getElementById('analyticsTopPages');if(!el)return;if(!pages.length){el.innerHTML='<div class="analytics-empty">Nincs oldaladat a kiválasztott időszakra.</div>';return}el.innerHTML=`<table class="analytics-table"><thead><tr><th>Oldal</th><th>Látogatások</th></tr></thead><tbody>${pages.slice().sort((a,b)=>Number(b.count||0)-Number(a.count||0)).slice(0,10).map(p=>`<tr><td>${esc(p.title||p.path||'Ismeretlen oldal')}<div class="hint">${esc(p.path||'')}</div></td><td><b>${fmtNum(p.count)}</b></td></tr>`).join('')}</tbody></table>`}

function saveGithubConfig(){const c={owner:document.getElementById('ghOwner').value.trim(),repo:document.getElementById('ghRepo').value.trim(),branch:document.getElementById('ghBranch').value.trim()||'main',path:document.getElementById('ghPath').value.trim()||'visual-editor-preview.html',message:document.getElementById('ghMessage').value.trim()||'Update website from visual editor'};localStorage.setItem(GH_CONFIG_KEY,JSON.stringify(c));showToast('GitHub-beállítások mentve.');}
function ghToken(){return sessionStorage.getItem('ia-gh-token')||''}
function clearGithubToken(){sessionStorage.removeItem('ia-gh-token');const el=document.getElementById('ghToken');if(el)el.value='';const st=document.getElementById('ghStatus');if(st)st.textContent='A token törölve a munkamenetből.'}
async function ghRequest(url,opts={}){const token=ghToken();if(!token)throw new Error('Add meg a GitHub tokent.');const res=await fetch(url,{...opts,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28',...(opts.headers||{})}});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.message||('GitHub API hiba: '+res.status));return data}
async function checkGithubConnection(){const tokenEl=document.getElementById('ghToken');if(tokenEl&&tokenEl.value.trim())sessionStorage.setItem('ia-gh-token',tokenEl.value.trim());saveGithubConfig();const c=ghConfig(),st=document.getElementById('ghStatus');try{if(!c.owner||!c.repo)throw new Error('Add meg a GitHub-felhasználót és a repó nevét.');const data=await ghRequest(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`);st.textContent=`Kapcsolat rendben: ${data.full_name}. Alapértelmezett branch: ${data.default_branch}.`;showToast('GitHub-kapcsolat sikeres.')}catch(e){st.textContent='Hiba: '+e.message;showToast('A GitHub-kapcsolat nem sikerült.')}}

 try{

  const base=`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/`;

  if(path==='index.html'&&existing&&existing.content){const raw=atob(String(existing.content).replace(/\n/g,''));const bytes=Uint8Array.from(raw,ch=>ch.charCodeAt(0));const original=new TextDecoder('utf-8').decode(bytes);const backupPath=`backups/index-before-visual-${new Date().toISOString().replace(/[:.]/g,'-')}.html`;await ghRequest(base+backupPath,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Backup original index.html before visual editor publish',content:b64Utf8(original),branch})});}
  const body={message:c.message||'Update website from visual editor',content:b64Utf8(buildVisualDocument()),branch};if(existing&&existing.sha)body.sha=existing.sha;
  const result=await ghRequest(base+path.split('/').map(encodeURIComponent).join('/'),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});

 }catch(e){showToast('Publikálási hiba: '+e.message);alert('A publikálás nem sikerült:\n'+e.message+'\n\nEllenőrizd a repó nevét, a branch-et és a Contents: Read and write jogosultságot.');}
}

async function visualDiscoverPages(){const select=document.getElementById('vePageSelect');if(!select)return;const found=new Set(['index.html','services.html']);for(const base of ['index.html','services.html']){try{const r=await fetch(base,{cache:'no-store'});if(!r.ok)continue;const d=new DOMParser().parseFromString(await r.text(),'text/html');d.querySelectorAll('a[href]').forEach(a=>{try{const u=new URL(a.getAttribute('href'),location.href);if(u.origin===location.origin&&/\.html?$/i.test(u.pathname)){const rel=u.pathname.split('/').pop();if(rel&&!rel.startsWith('admin'))found.add(rel)}}catch(e){}})}catch(e){}}visualDiscoveredPages=[...found].sort((a,b)=>a==='index.html'?-1:b==='index.html'?1:a.localeCompare(b));const current=visualPagePath;select.innerHTML=visualDiscoveredPages.map(x=>`<option value="${esc(x)}">${esc(x==='index.html'?'Kezdőlap':x.replace(/\.html?$/i,'').replace(/[-_]/g,' ').replace(/\b\w/g,m=>m.toUpperCase()))} (${esc(x)})</option>`).join('');select.value=current;}

function visualSnapshot(){if(!visualEditor||visualRestoring)return;const item={html:visualEditor.getHtml(),css:visualEditor.getCss()};if(visualHistoryIndex>=0&&JSON.stringify(visualHistory[visualHistoryIndex])===JSON.stringify(item))return;visualHistory=visualHistory.slice(0,visualHistoryIndex+1);visualHistory.push(item);if(visualHistory.length>60)visualHistory.shift();visualHistoryIndex=visualHistory.length-1;}
function visualRestoreHistory(index){if(!visualEditor||index<0||index>=visualHistory.length)return;visualRestoring=true;visualHistoryIndex=index;visualEditor.setComponents(visualHistory[index].html);visualEditor.setStyle(visualHistory[index].css);visualRestoring=false;}

 function refreshSelection(){const d=frame.contentDocument;if(!d)return;d.querySelectorAll('[data-ve-selected="1"]').forEach(n=>{n.removeAttribute('data-ve-selected');n.style.outline=''});if(selected&&selected.isConnected){selected.setAttribute('data-ve-selected','1');selected.style.outline='2px solid #238a55';document.getElementById('veSelectedLabel').textContent='Kijelölve: <'+selected.tagName.toLowerCase()+'>';document.getElementById('veSelectedText').value=['IMG','VIDEO','IFRAME'].includes(selected.tagName)?'':(selected.innerText||'').trim().slice(0,240);document.getElementById('veSelectedHref').value=selected.closest('a')?.getAttribute('href')||'';document.getElementById('veSelectedSrc').value=selected.matches('img,source,iframe,video')?(selected.getAttribute('src')||''):'';document.getElementById('veSelectedAlt').value=selected.matches('img')?(selected.getAttribute('alt')||''):'';document.getElementById('veFontSize').value=parseInt(getComputedStyle(selected).fontSize)||16;document.getElementById('vePadding').value=parseInt(getComputedStyle(selected).padding)||0;} }
 function bindSelection(){try{const d=frame.contentDocument;if(!d)return;d.addEventListener('click',e=>{if(e.target.closest('a'))e.preventDefault();selected=e.target;refreshSelection();},{capture:true});d.addEventListener('input',()=>{clearTimeout(window.__veHistoryTimer);window.__veHistoryTimer=setTimeout(visualSnapshot,500)});d.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();visualUndo()} });enableReorder();}catch(e){}}
 document.getElementById('veApplyProperties').addEventListener('click',()=>{if(!selected||!selected.isConnected){showToast('Előbb jelölj ki egy elemet az előnézetben.');return;}const text=document.getElementById('veSelectedText').value,alt=document.getElementById('veSelectedAlt').value,href=document.getElementById('veSelectedHref').value.trim(),src=document.getElementById('veSelectedSrc').value.trim(),fs=Math.max(8,Math.min(160,Number(document.getElementById('veFontSize').value)||16)),pad=Math.max(0,Math.min(200,Number(document.getElementById('vePadding').value)||0));if(!['IMG','VIDEO','IFRAME','SOURCE'].includes(selected.tagName)&&text!==''&&selected.children.length===0)selected.textContent=text;if(selected.matches('img,video,iframe,source')&&src)selected.setAttribute('src',src);if(selected.matches('img'))selected.setAttribute('alt',alt);const link=selected.closest('a');if(link&&href)link.setAttribute('href',href);else if(selected.tagName==='A'&&href)selected.setAttribute('href',href);selected.style.fontSize=fs+'px';selected.style.padding=pad+'px';refreshSelection();visualSnapshot();showToast('A kijelölt elem módosult. Mentsd a piszkozatot.');});
 frame.addEventListener('load',()=>{bindSelection();setTimeout(visualSnapshot,100)});
}

async function visualLoadCurrent(){if(!visualEditor)return;try{const path=visualPagePath||'index.html';const res=await fetch(path,{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const html=await res.text();const doc=new DOMParser().parseFromString(html,'text/html');visualDocumentTemplate='<!doctype html>\n'+doc.documentElement.outerHTML;let cssParts=[];doc.querySelectorAll('style').forEach(el=>{if(el.textContent)cssParts.push(el.textContent)});for(const link of doc.querySelectorAll('link[rel="stylesheet"]')){try{const u=new URL(link.getAttribute('href'),location.href);const r=await fetch(u.href,{cache:'no-store'});if(r.ok)cssParts.push('\n/* '+u.pathname+' */\n'+await r.text())}catch(e){cssParts.push('/* Nem sikerült beolvasni a stíluslapot: '+link.href+' */')}}doc.querySelectorAll('script,link[rel="stylesheet"],style').forEach(el=>el.remove());visualEditor.setComponents(doc.body?doc.body.innerHTML:'');visualEditor.setStyle(cssParts.join('\n'));visualSnapshot();showToast(path+' betöltve. A tartalom szerkeszthető; az eredeti head és script-elemek exportáláskor megmaradnak.');}catch(e){showToast('Nem sikerült betölteni: '+e.message+'. A GitHub Pagesen vagy helyi webszerveren nyisd meg, ne file:// módban.');}}
function visualSaveDraft(silent=false){if(!visualEditor){if(!silent)showToast('A szerkesztő még nem áll készen.');return;}visualSnapshot();const data={html:visualEditor.getHtml(),css:visualEditor.getCss(),template:visualDocumentTemplate,savedAt:new Date().toISOString(),page:visualPagePath};localStorage.setItem(visualPageDraftKey(),JSON.stringify(data));if(!silent)showToast('Piszkozat mentve ehhez az oldalhoz ebben a böngészőben.');}
async function visualExport(){
 if(!visualEditor){showToast('A szerkesztő még nem áll készen.');return;}
 if(typeof JSZip==='undefined'){showToast('A ZIP-készítő könyvtár nem töltődött be. Ellenőrizd az internetkapcsolatot, majd próbáld újra.');return;}
 visualSaveDraft();
 const zip=new JSZip();
 // Public website files only. Admin pages, editor assets, and editor notes are intentionally excluded.
 const files=[
  'index.html','services.html','styles.css','script.js','site-data.json',
  'assets/logo.svg','assets/profile.jpg'
 ];
 const skipped=[];
 for(const path of files){
  try{
   let content;
   if(path===visualPagePath){content=buildVisualDocument();}
   else {const response=await fetch(path,{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);content=await response.text();}
   // Prevent internal editor-only links/scripts from leaking into the public package.
   if(path.endsWith('.html')){
    const doc=new DOMParser().parseFromString(content,'text/html');
    doc.querySelectorAll('a[href="admin.html"],a[href="admin.v13.html"],script[src*="admin"],link[href*="admin"]').forEach(el=>el.remove());
    content='<!doctype html>\n'+doc.documentElement.outerHTML;
   }
   zip.file(path,content);
  }catch(err){skipped.push(path+' ('+err.message+')');}
 }
 // Preserve any public image/font/media files known in the current assets directory manifest.
 // GitHub Pages has no directory-list API, so this explicit list is kept in sync with this project.
 try{
  const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
  downloadBlob('ivan-andras-digital-studio-weboldal.zip',blob);
  showToast(skipped.length?'ZIP export elkészült, de néhány fájl kimaradt: '+skipped.join(', '):'A teljes weboldal ZIP-exportja elkészült. Az adminfelület és a vizuális szerkesztő nincs a csomagban.');
 }catch(err){showToast('A ZIP-export sikertelen: '+err.message);}
}
function downloadBlob(name,blob){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function downloadText(name,text,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}

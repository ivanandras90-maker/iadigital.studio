<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Iván András Digital Studio</title><link rel="stylesheet" href="styles.css"></head><body class="admin-body">
<div id="login" class="login"><div class="login-card"><img src="assets/logo.svg"><h1>Belépés</h1><p>Weboldal kezelőfelület</p><input id="pass" type="password" placeholder="Jelszó"><button class="btn green" onclick="login()">Belépés</button><a href="index.html">← Weboldal</a></div></div>
<div id="cms" class="cms hidden"><aside><img src="assets/logo.svg"><h3>CONTENT MANAGEMENT</h3><button class="side active" data-p="general">Általános</button><button class="side" data-p="language">Nyelvek / Hero</button><button class="side" data-p="services">Szolgáltatások</button><button class="side" data-p="projects">Projektek</button><button class="side" data-p="contact">Kapcsolat</button><button class="side" data-p="appearance">Megjelenés</button><button class="logout" onclick="logout()">Kilépés</button></aside>
<section class="editor"><div class="editor-top"><div><p class="eyebrow">ADMINISTRATION</p><h1>Website editor</h1></div><div><button class="btn" onclick="window.open('index.html','_blank')">Preview</button><button class="btn green" onclick="save()">Mentés</button></div></div><div id="panel"></div></section></div>
<script>
const KEY='ia-digital-cms-v6';
const DEFAULT={"settings": {"accent": "#2f8f5b", "dark": "#0d1712", "soft": "#f2f7f3", "siteTitle": "Iván András Digital Studio"}, "contact": {"phone": "+420 722 076 243", "email": "ivan.andras90@gmail.com", "location": "Česká republika · Praha a okolí", "facebook": "https://www.facebook.com/andras.ivan.56"}, "languages": {"cs": {"heroK": "IVÁN ANDRÁS / DIGITAL STUDIO", "heroH": "Digitální řešení, která mají smysl.", "heroP": "Webové stránky, webové aplikace a interaktivní mapy v prémiovém provedení.", "heroCta": "Prohlédnout projekty", "services": "Služby", "projects": "Vybrané projekty", "about": "O mně", "contact": "Kontakt", "contactH": "Máte projekt?", "contactP": "Napište mi stručně, co potřebujete. Ozvu se s návrhem dalšího postupu.", "web": "Webové stránky", "webP": "Moderní, rychlé a responzivní weby.", "app": "Webové aplikace", "appP": "Kalkulátory, databáze, administrace a vlastní nástroje.", "map": "Web Mapping & GIS", "mapP": "Interaktivní mapy, GeoJSON, GIS a prostorová data.", "design": "Design & fotografie", "designP": "UI/UX, vizuální obsah a profesionální fotografie.", "nav": ["Domů", "Služby", "Projekty", "O mně", "Kontakt"]}, "en": {"heroK": "IVÁN ANDRÁS / DIGITAL STUDIO", "heroH": "Digital solutions with purpose.", "heroP": "Premium websites, web applications and interactive mapping systems.", "heroCta": "View projects", "services": "Services", "projects": "Selected projects", "about": "About", "contact": "Contact", "contactH": "Have a project?", "contactP": "Tell me briefly what you need. I will reply with the next steps.", "web": "Websites", "webP": "Modern, fast and responsive websites.", "app": "Web applications", "appP": "Calculators, databases, admin systems and custom tools.", "map": "Web Mapping & GIS", "mapP": "Interactive maps, GeoJSON, GIS and spatial data.", "design": "Design & photography", "designP": "UI/UX, visual content and professional photography.", "nav": ["Home", "Services", "Projects", "About", "Contact"]}, "uk": {"heroK": "IVÁN АНДРАС / DIGITAL STUDIO", "heroH": "Цифрові рішення з сенсом.", "heroP": "Преміальні вебсайти, вебзастосунки та інтерактивні карти.", "heroCta": "Переглянути проєкти", "services": "Послуги", "projects": "Вибрані проєкти", "about": "Про мене", "contact": "Контакти", "contactH": "Маєте проєкт?", "contactP": "Коротко опишіть завдання. Я відповім і запропоную наступні кроки.", "web": "Вебсайти", "webP": "Сучасні, швидкі та адаптивні вебсайти.", "app": "Вебзастосунки", "appP": "Калькулятори, бази даних, адмінсистеми та власні інструменти.", "map": "Web Mapping & GIS", "mapP": "Інтерактивні карти, GeoJSON, GIS та просторові дані.", "design": "Дизайн і фотографія", "designP": "UI/UX, візуальний контент та професійна фотографія.", "nav": ["Головна", "Послуги", "Проєкти", "Про мене", "Контакти"]}, "hu": {"heroK": "IVÁN ANDRÁS / DIGITAL STUDIO", "heroH": "Digitális megoldások valódi céllal.", "heroP": "Prémium weboldalak, webalkalmazások és interaktív térképes rendszerek.", "heroCta": "Projektek megtekintése", "services": "Szolgáltatások", "projects": "Kiemelt projektek", "about": "Rólam", "contact": "Kapcsolat", "contactH": "Van egy projekted?", "contactP": "Írd meg röviden, mire van szükséged. Válaszolok és javaslatot teszek a következő lépésekre.", "web": "Weboldalak", "webP": "Modern, gyors és reszponzív weboldalak.", "app": "Webalkalmazások", "appP": "Kalkulátorok, adatbázisok, adminrendszerek és egyedi eszközök.", "map": "Web Mapping & GIS", "mapP": "Interaktív térképek, GeoJSON, GIS és térinformatikai adatok.", "design": "Design és fotózás", "designP": "UI/UX, vizuális tartalom és professzionális fotózás.", "nav": ["Kezdőlap", "Szolgáltatások", "Projektek", "Rólam", "Kapcsolat"]}}, "projects": [{"id": "atlas", "title": "Karpátalja Atlasz", "category": "WEB MAPPING / GIS", "description": "Interaktivní historický atlas s mapovými vrstvami a prostorovými daty.", "enabled": true}, {"id": "roof", "title": "Roof Calculator", "category": "WEB APPLICATION", "description": "Geometrický výpočet střešních ploch v prohlížeči.", "enabled": true}, {"id": "camp", "title": "Camping Web System", "category": "WEB / TOURISM", "description": "Turistický web s interaktivní mapou areálu.", "enabled": true}]};
let d=JSON.parse(localStorage.getItem(KEY)||'null')||DEFAULT;
let current='general', lang='cs';
const fields=['heroK','heroH','heroP','heroCta','services','projects','about','contact','contactH','contactP','web','webP','app','appP','map','mapP','design','designP'];
function login(){if(document.getElementById('pass').value==='digital2026'){sessionStorage.cms='1';show()}else alert('Helytelen jelszó')}
function show(){loginEl.classList.add('hidden');cms.classList.remove('hidden');render('general')}
function logout(){sessionStorage.removeItem('cms');location.reload()}
const loginEl=document.getElementById('login'),cms=document.getElementById('cms'),panel=document.getElementById('panel');
function input(label,value,key,area=false){return `<label>${label}${area?`<textarea data-key="${key}">${esc(value)}</textarea>`:`<input data-key="${key}" value="${esc(value)}">`}</label>`}
function esc(s=''){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(p){
 current=p;document.querySelectorAll('.side').forEach(x=>x.classList.toggle('active',x.dataset.p===p));
 if(p==='general')panel.innerHTML=`<h2>Általános</h2>${input('Weboldal neve',d.settings.siteTitle,'siteTitle')}`;
 if(p==='appearance')panel.innerHTML=`<h2>Megjelenés</h2><div class="row">${input('Accent zöld',d.settings.accent,'accent')}${input('Sötét szín',d.settings.dark,'dark')}</div>${input('Világos zöld háttér',d.settings.soft,'soft')}`;
 if(p==='contact')panel.innerHTML=`<h2>Kapcsolat</h2>${input('Telefon',d.contact.phone,'phone')}${input('E-mail',d.contact.email,'email')}${input('Helyszín',d.contact.location,'location')}${input('Facebook',d.contact.facebook,'facebook')}${input('Profilkép URL / fájlnév',d.contact.profilePhoto||'assets/profile.jpg','profilePhoto')}`;
 if(p==='language')panel.innerHTML=`<h2>Nyelvi tartalom</h2><div class="lang-tabs">${['cs','en','uk','hu'].map(x=>`<button class="${x===lang?'sel':''}" onclick="changeLang('${x}')">${x.toUpperCase()}</button>`).join('')}</div>${fields.map(k=>input(k,d.languages[lang][k],k,k==='heroP'||k==='contactP'||k==='webP'||k==='appP'||k==='mapP'||k==='designP')).join('')}`;
 if(p==='services')panel.innerHTML=`<h2>Szolgáltatások</h2>${['web','app','map','design'].map(k=>`<div class="admin-card">${input('Cím',d.languages[lang][k],k)}${input('Leírás',d.languages[lang][k+'P'],k+'P',true)}</div>`).join('')}<p class="hint">Nyelv: ${lang.toUpperCase()} — a felső „Nyelvek / Hero” menüben válthatsz nyelvet.</p>`;
 if(p==='projects')panel.innerHTML=`<h2>Projektek</h2>${d.projects.map((p,i)=>`<div class="admin-card"><b>${String(i+1).padStart(2,'0')}</b>${input('Projekt címe',p.title,`project_title_${i}`)}${input('Kategória',p.category,`project_cat_${i}`)}${input('Leírás',p.description,`project_desc_${i}`,true)}<label class="check"><input type="checkbox" data-key="project_enabled_${i}" ${p.enabled?'checked':''}> Megjelenjen</label></div>`).join('')}<button class="btn green" onclick="addProject()">+ Új projekt</button>`;
}
function changeLang(x){lang=x;render(current)}
function collect(){
 document.querySelectorAll('[data-key]').forEach(el=>{
  const k=el.dataset.key, v=el.type==='checkbox'?el.checked:el.value;
  if(k.startsWith('project_')){const parts=k.split('_'),type=parts[1],i=parts[2];if(type==='enabled')d.projects[i].enabled=v;else d.projects[i][type==='title'?'title':type==='cat'?'category':'description']=v}
  else if(['siteTitle','accent','dark','soft'].includes(k))d.settings[k]=v;
  else if(['phone','email','location','facebook','profilePhoto'].includes(k))d.contact[k]=v;
  else if(fields.includes(k))d.languages[lang][k]=v;
 });
 localStorage.setItem(KEY,JSON.stringify(d));alert('A tartalom elmentve. A főoldal frissítés után az új tartalmat mutatja.');
}
function save(){collect()}
function addProject(){d.projects.push({id:'project'+Date.now(),title:'Új projekt',category:'WEB',description:'Projekt leírása',enabled:true});localStorage.setItem(KEY,JSON.stringify(d));render('projects')}
document.querySelectorAll('.side').forEach(x=>x.onclick=()=>render(x.dataset.p));
if(sessionStorage.cms==='1')show();
</script></body></html>
